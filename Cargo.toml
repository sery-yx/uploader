[package]
name = "uploader"
version = "0.1.0"
edition = "2021"

description = "A small private file uploader with viewers for pictures, GIFs, video, audio and text"

[dependencies]
actix-cors = "0.7.1"
actix-files = "0.7.4"
actix-web = "4.13.0"
actix-web-error = "0.2.0"
askama = "0.16.0"
base64 = "0.23.0"
bytes = "1.11.1"
clap = { version = "4.6.0", features = ["derive"] }
constant_time_eq = "0.6.1"
futures = "0.3"
hmac = "0.13.0"
humantime = "2.3.0"
infer = "0.22.0"
mime = "0.3.17"
mime_guess = "2.0.5"
multer = "3.1.0"
rand = "0.10.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
thiserror = "2.0.18"
tokio = { version = "1.50", features = ["fs"] }
toml = "1.0.7"
tracing = "0.1.44"
tracing-actix-web = "0.7.21"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1.50", features = ["macros", "rt"] }
