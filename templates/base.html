{%- import "macros.html" as m -%}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#1e1f23" />
    <title>{% block title %}cyex uploader{% endblock %}</title>
    <script src="/static/js/theme.js"></script>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/static/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/static/css/tokens.css" />
    <link rel="stylesheet" href="/static/css/app.css" />
    {%- block head %}{% endblock %}
    <script type="module" src="/static/js/ui.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="wrap header-row">
        <a class="lockup" href="/">
          <svg class="mark" viewBox="3 5 25 22" aria-hidden="true">
            <rect x="3" y="5" width="15" height="6" fill="var(--text)" />
            <rect x="10" y="13" width="18" height="6" fill="var(--accent)" />
            <rect x="3" y="21" width="15" height="6" fill="var(--text)" />
          </svg>
          <span>uploader</span>
        </a>
        <nav class="nav" aria-label="Main">
          <a href="/" {% block nav_upload %}{% endblock %}>Upload</a>
          <a href="/admin" id="nav-keys" hidden {% block nav_keys %}{% endblock %}>Keys</a>
        </nav>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch to light theme" data-tip="Switch to light theme">
          <span class="theme-dark-icon">{% call m::i("sun") %}{% endcall %}</span>
          <span class="theme-light-icon" hidden>{% call m::i("moon") %}{% endcall %}</span>
        </button>
      </div>
    </header>
    <main id="main" class="page">
      <div class="wrap">{% block main %}{% endblock %}</div>
    </main>
    <footer class="site-footer">
      <div class="wrap footer-row">
        <span>cyex uploader</span>
        <span>Based on <a href="https://github.com/Nerixyz/uploader">Nerixyz/uploader</a></span>
      </div>
    </footer>
    <div class="toasts notices" aria-live="polite"></div>
    <div class="toasts errors" aria-live="assertive"></div>
  </body>
</html>
